<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Anatomy - Brain ATL.</title>
</head>

<body>
        <header class="site-header" id="site-header"></header>
    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-3">
                <select id="search-type" class="form-control form-control-sm">
                    <option value="name">Search by Region Name</option>
                    <option value="category">Search by Category</option>
                </select>
            </div>
            <div class="col-md-6">
                <input type="text" id="search-input" class="form-control" placeholder="Search...">
            </div>
            <div class="col-md-3 text-right">
                <button id="search-btn" class="btn btn-dark px-5">Search</button>
            </div>
        </div>
        <div id="products" class="row"></div>
        <p id="no-results" class="text-center text-muted" style="display:none">No regions found.</p>
    </div>
    <div id="modal-bg" class="modal-bg" onclick="closeModal(event)">
        <div id="modal-box" class="modal-box"></div>
    </div>
    <div id="site-footer"></div>
    <script src="js/app.js"></script>
    <script src="js/anatomy.js"></script>
</body>

</html>
