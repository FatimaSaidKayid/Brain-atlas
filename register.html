<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Register - Brain ATL.</title>
</head>

<body>
        <header class="site-header" id="site-header"></header>
    <div class="container mt-4">
        <form id="register-form" class="form-box p-4 col-lg-10 mx-auto">
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" class="form-control form-control-sm"
                        placeholder="Enter first name" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" class="form-control form-control-sm" placeholder="Enter last name"
                        required>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control form-control-sm" placeholder="Enter email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control form-control-sm" placeholder="Enter password"
                    required>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Register</button>
            <p class="mt-3 mb-0 small">Have an account? <a href="login.html">Login</a></p>
        </form>
    </div>
    <div id="site-footer"></div>
    <script src="js/app.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
